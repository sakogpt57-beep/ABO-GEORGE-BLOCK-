 var d=t.dataset;
 if(d.p){var a=S.apps[d.p];a[d.k]=!a[d.k];save();render();return}
 if(d.t){tab=d.t;if(NATIVE)pollData();render();window.scrollTo(0,0);return}
 if(d.f){flt=d.f;render();return}
 if(d.th){S.theme=d.th;save();render();return}
 var c=d.act;if(!c)return;
 if(c==="master"){S.on=!S.on;save();render()}
 else if(c==="boot"){S.boot=!S.boot;save();render()}
 else if(c==="sim"){S.sim=!S.sim;save();render()}
 else if(c==="blockall"){setAll("w",false);setAll("m",false)}
 else if(c==="allowuser"){setAll("w",true,0);setAll("m",true,0)}
 else if(c==="usage")Android.openUsageSettings();
 else if(c==="reset"){if(confirm("تصفير الاستهلاك؟"))reset()}
});
document.addEventListener("input",function(e){if(e.target.id==="q"){q=e.target.value;renderList()}});
document.addEventListener("change",function(e){var t=e.target;
 if(t.id==="net"){S.net=t.value;save();render()}
 else if(t.id==="lim"){S.limit=Math.max(0,+t.value||0);S.capped=false;save();render()}});
function tick(){var b=nk()+"b",c=S.limit&&S.net==="mobile"&&S.capped;
 APPS.forEach(function(x){if(Math.random()>0.35)return;var a=S.apps[x[1]];if(!S.on||(a[nk()]&&!c))a[b]+=Math.floor((x[2]?2e3:2e4)*(0.2+Math.random()*3))});
 checkCap();save();if(tab!=="apps")render();else renderList()}
function pollData(){try{var u=JSON.parse(Android.getUsage(String(S.since)));APPS.forEach(function(x){var v=u[x[1]]||{w:0,m:0},a=S.apps[x[1]];a.wb=v.w;a.mb=v.m});checkCap()}catch(e){}}
load();render();
if(NATIVE){pollData();setInterval(function(){var n=S.net;S.net=Android.getNet();pollData();if(S.net!==n||tab==="usage")render()},5000)}
else setInterval(function(){if(S.sim)tick()},2500);
</script>
</body>
